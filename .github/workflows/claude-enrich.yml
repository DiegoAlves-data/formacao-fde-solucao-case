name: Enriquece com o Claude

# #66 O Claude roda aqui, e não no Worker: a única credencial é o token de setup do Claude Code
# (CLAUDE_CODE_OAUTH_TOKEN), que serve ao Claude Code e ao Agent SDK e não à Messages API crua.
# O job grava as sugestões em claude_suggestions; o Worker só as lê, e a regra determinística
# confirma cada uma. Sem sugestão, a regra decide sozinha (fail-closed).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Tarefas separadas por vírgula (vazio = todas)'
        type: string
        default: ''
      eval:
        description: 'Roda o eval do casamento de descrição (AC-6) em vez de enriquecer'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: claude-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jobs/claude
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/claude/package-lock.json
      - run: npm ci --no-audit --no-fund
      # #66 Grava no banco de produção: só a partir da main.
      - name: Enriquecer
        if: ${{ !inputs.eval && github.ref == 'refs/heads/main' }}
        run: npm start
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.BARTE_ACADEMY_CLAUDE_CODE_OAUTH_TOKEN }}
          BARTE_ACADEMY_SUPABASE_URL: ${{ vars.BARTE_ACADEMY_SUPABASE_URL }}
          BARTE_ACADEMY_SUPABASE_SECRET_KEY: ${{ secrets.BARTE_ACADEMY_SUPABASE_SECRET_KEY }}
          # #66 O input entra pelo ambiente, nunca interpolado no run.
          CLAUDE_TASKS: ${{ inputs.tasks }}
      # #66 O eval lê só o kit em data/kit/ e não toca no banco: leva apenas o token do Claude.
      - name: Eval
        if: ${{ inputs.eval }}
        run: npm run eval:description-match
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.BARTE_ACADEMY_CLAUDE_CODE_OAUTH_TOKEN }}
